# ClinAgenda completo: base de datos, API, web y respaldos automáticos.
#   cp .env.example .env   (y cambie las claves)
#   docker compose up --build
# Web: http://localhost:3000 · API y Swagger: http://localhost:4000/api/docs

name: clinagenda

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinagenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-clinagenda}
      TZ: America/Guayaquil
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clinagenda}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clinagenda}?schema=public
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env (openssl rand -hex 32)}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_MODE: ${SEED_MODE:-demo}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-Demo2026!}
      BACKUP_STATUS_FILE: /backups/estado.json
      TZ: America/Guayaquil
    volumes:
      # Solo lectura: la API únicamente revisa si el último respaldo salió bien.
      - ./backups:/backups:ro,z
    ports:
      # Solo accesible desde el propio servidor; la gente entra por la web (que reenvía /api).
      - '127.0.0.1:4000:4000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 6

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    environment:
      # La página pública consulta horarios y médicos a la API desde el servidor.
      API_INTERNAL_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO', '/dev/null', 'http://127.0.0.1:3000/ingresar']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-clinagenda}
      POSTGRES_DB: ${POSTGRES_DB:-clinagenda}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      TZ: America/Guayaquil
    volumes:
      - ./backups:/backups:z
      # Carpeta FUERA del servidor: un disco externo o una carpeta sincronizada con la nube.
      - ${BACKUP_COPY_PATH:-./backups-copia}:/backups-copy:z
      - ./docker/backup.sh:/backup.sh:ro,z
    entrypoint: ['sh', '/backup.sh']

  # Solo en producción:  docker compose --profile produccion up -d
  # Requiere DOMAIN en .env (ej. agenda.clinicasparedes.ec) apuntando a este servidor y COOKIE_SECURE=true.
  https:
    image: caddy:2-alpine
    profiles: ['produccion']
    restart: unless-stopped
    depends_on:
      - web
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
